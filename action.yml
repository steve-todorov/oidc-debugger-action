name: 'oidc-debugger-action'
description: 'Print decoded OIDC token claims generated through Github Actions.'
inputs:
  audience:
    description: 'The audience to use when requesting the JWT. Your Github server URL and repository owner (e.g. https://github.com/github).'
    required: true
    default: '${{ github.server_url }}/${{ github.repository }}'
runs:
  using: "composite"
  steps:
    - name: Debug OIDC claims
      shell: bash
      env:
        AUDIENCE: "${{ inputs.audience }}"
      run: |
        # Debug OIDC claims
        set -euo pipefail
        response=$(curl -s -w "\n%{http_code}" \
          -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
          "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${AUDIENCE}")
        
        body="${response%$'\n'*}"
        status="${response##*$'\n'}"
        
        if [ "$status" != "200" ]; then
          echo "Unexpected status: $status"
          echo "$body"
          exit 1
        fi
        
        TOKEN_JSON="$body"
        ID_TOKEN=$(echo "$TOKEN_JSON" | jq -r '.value')
        # GH returns the base64 encoded token in base64url safe format which causes `base64 -d` to fail sometimes (but still print the payload)
        echo "$ID_TOKEN" \
          | jq -R 'split(".")[1]        # take payload segment
                   | gsub("-"; "+")     # base64url -> base64
                   | gsub("_"; "/")
                   | . + "==="          # add padding
                   | @base64d           # decode
                   | fromjson'          # parse JSON
